name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Check updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const config = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error("Configure TAURI_SIGNING_PRIVATE_KEY before releasing.");
            if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${config.version}` || pkg.version !== config.version) throw new Error("Stable release tag and app versions must match.");
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.targets }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Skill Sync v__VERSION__'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
