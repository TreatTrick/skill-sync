<!doctype html>
<meta charset="utf-8" />
<title>Skill Sync 重设计原型</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
  /* Layout: 顶栏 + 单列“变更清单”，按“需要你做什么”分组，底部常驻提交栏；设置为“左目录 + 设置行”；首次配置为“左步骤轨 + 右当前步骤”。 */
  :root {
    /* 沿用 src/index.css 的语义 token 名称与取值，落地时无需新增调色板 */
    --background: #f6f7f9;
    --foreground: #1a1f29;
    --surface: #ffffff;
    --surface-muted: #f4f5f7;
    --surface-hover: #eef0f3;
    --border: #e3e6eb;
    --border-muted: #eceef1;
    --border-strong: #d2d7de;
    --muted-foreground: #5b6471;
    --strong-foreground: #0e1320;
    --primary: #0f766e;
    --primary-foreground: #ffffff;
    --primary-muted: #ecfdf8;
    --primary-muted-foreground: #115e59;
    --primary-border: #99f6e4;
    --info-muted: #e0ecff;
    --info-muted-foreground: #1d4ed8;
    --info-border: #bfdbfe;
    --remote: #7e22ce;
    --remote-muted: #f3e8ff;
    --remote-border: #d8b4fe;
    --warning: #b45309;
    --warning-muted: #fff7e6;
    --warning-border: #fde68a;
    --destructive: #dc2626;
    --destructive-foreground: #ffffff;
    --destructive-muted: #fef2f2;
    --destructive-border: #fecaca;
    --success: #15803d;
    --success-muted: #f0fdf4;
    --success-border: #bbf7d0;
    --ring: #0f766e;
    --shadow-sm:
      0 1px 3px 0 rgba(15, 23, 42, 0.08), 0 1px 2px -1px rgba(15, 23, 42, 0.05);
    --shadow-lg:
      0 12px 24px -6px rgba(15, 23, 42, 0.14),
      0 4px 8px -4px rgba(15, 23, 42, 0.08);
    --overlay: rgba(14, 19, 32, 0.42);
    --font-sans:
      'Segoe UI', system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif;
    --font-mono:
      ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo,
      monospace;
    --gutter-l: max(24px, env(safe-area-inset-left, 0px));
    --gutter-r: max(24px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --background: #0d1117;
      --foreground: #e6edf3;
      --surface: #161b22;
      --surface-muted: #1c2128;
      --surface-hover: #22272e;
      --border: #2d333b;
      --border-muted: #252a31;
      --border-strong: #3d444d;
      --muted-foreground: #8b949e;
      --strong-foreground: #f0f6fc;
      --primary: #2dd4bf;
      --primary-foreground: #04201c;
      --primary-muted: #0d2e2a;
      --primary-muted-foreground: #5eead4;
      --primary-border: #134e4a;
      --info-muted: #0d2138;
      --info-muted-foreground: #93b4ff;
      --info-border: #1e3a5f;
      --remote: #d8b4fe;
      --remote-muted: #2e1065;
      --remote-border: #6b21a8;
      --warning: #f59e0b;
      --warning-muted: #2a1f0a;
      --warning-border: #7a5230;
      --destructive: #f87171;
      --destructive-foreground: #ffffff;
      --destructive-muted: #2a1515;
      --destructive-border: #5c2424;
      --success: #4ade80;
      --success-muted: #0f2818;
      --success-border: #1f4d33;
      --ring: #2dd4bf;
      --overlay: rgba(0, 0, 0, 0.6);
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --background: #0d1117;
    --foreground: #e6edf3;
    --surface: #161b22;
    --surface-muted: #1c2128;
    --surface-hover: #22272e;
    --border: #2d333b;
    --border-muted: #252a31;
    --border-strong: #3d444d;
    --muted-foreground: #8b949e;
    --strong-foreground: #f0f6fc;
    --primary: #2dd4bf;
    --primary-foreground: #04201c;
    --primary-muted: #0d2e2a;
    --primary-muted-foreground: #5eead4;
    --primary-border: #134e4a;
    --info-muted: #0d2138;
    --info-muted-foreground: #93b4ff;
    --info-border: #1e3a5f;
    --remote: #d8b4fe;
    --remote-muted: #2e1065;
    --remote-border: #6b21a8;
    --warning: #f59e0b;
    --warning-muted: #2a1f0a;
    --warning-border: #7a5230;
    --destructive: #f87171;
    --destructive-foreground: #ffffff;
    --destructive-muted: #2a1515;
    --destructive-border: #5c2424;
    --success: #4ade80;
    --success-muted: #0f2818;
    --success-border: #1f4d33;
    --ring: #2dd4bf;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font: 14px/1.5 var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  h1,
  h2,
  h3,
  p,
  dl {
    margin: 0;
  }
  h1,
  h2,
  h3 {
    text-wrap: balance;
    color: var(--strong-foreground);
  }
  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }
  .mono {
    font-family: var(--font-mono);
  }
  .muted {
    color: var(--muted-foreground);
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  .ic {
    width: 16px;
    height: 16px;
    flex: none;
  }
  .ic.sm {
    width: 14px;
    height: 14px;
  }
  .ic.lg {
    width: 20px;
    height: 20px;
  }
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ---------- 原型控制条（不属于产品 UI） ---------- */
  .proto {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding: 6px var(--gutter-r) 6px var(--gutter-l);
    background: var(--surface-muted);
    border-bottom: 1px dashed var(--border-strong);
    font: 12px/1.4 var(--font-mono);
    color: var(--muted-foreground);
  }
  .proto b {
    color: var(--foreground);
    font-weight: 600;
  }
  .proto label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .proto select {
    height: 24px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    padding: 0 4px;
    font: 12px var(--font-sans);
  }
  .proto .sp {
    flex: 1;
  }

  /* ---------- 顶栏 ---------- */
  .top {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 52px;
    flex: none;
    padding: 0 max(var(--gutter-r), calc((100% - 1132px) / 2)) 0
      max(var(--gutter-l), calc((100% - 1132px) / 2));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--strong-foreground);
    font-size: 15px;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand svg {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    box-shadow: var(--shadow-sm);
  }
  .tabs {
    display: flex;
    gap: 2px;
  }
  .tab {
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--muted-foreground);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tab:hover {
    background: var(--surface-hover);
    color: var(--foreground);
  }
  .tab[aria-current='page'] {
    background: var(--primary-muted);
    color: var(--primary-muted-foreground);
    font-weight: 600;
  }
  .tab .dot {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--warning);
    color: var(--surface);
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .top .sp {
    flex: 1;
  }
  .vault {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--foreground);
    min-width: 0;
    max-width: 46vw;
  }
  .vault:hover {
    background: var(--surface-hover);
  }
  .vault .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex: none;
  }
  .vault .repo {
    font: 12.5px var(--font-mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vault .br {
    font: 12px var(--font-mono);
    color: var(--muted-foreground);
    white-space: nowrap;
  }

  .view {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px var(--gutter-r) 32px var(--gutter-l);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- 基础控件 ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 34px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--foreground);
    font-weight: 500;
    white-space: nowrap;
    transition:
      background 0.12s,
      border-color 0.12s;
  }
  .btn:hover {
    background: var(--surface-hover);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
    font-weight: 600;
  }
  .btn.primary:hover:not(:disabled) {
    filter: brightness(1.08);
  }
  .btn.danger {
    background: var(--surface);
    border-color: var(--destructive-border);
    color: var(--destructive);
  }
  .btn.danger:hover {
    background: var(--destructive-muted);
  }
  .btn.danger.solid {
    background: var(--destructive);
    border-color: var(--destructive);
    color: var(--destructive-foreground);
  }
  .btn.ghost {
    border-color: transparent;
    background: none;
    color: var(--muted-foreground);
  }
  .btn.ghost:hover {
    background: var(--surface-hover);
    color: var(--foreground);
  }
  .btn.sm {
    height: 28px;
    padding: 0 10px;
    font-size: 12.5px;
    border-radius: 7px;
  }
  .btn.lg {
    height: 40px;
    padding: 0 18px;
    font-size: 15px;
  }
  .btn.icon {
    width: 28px;
    height: 28px;
    padding: 0;
  }
  .spin {
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  input[type='checkbox'] {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: var(--primary);
    cursor: pointer;
    flex: none;
  }
  .input {
    height: 34px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    padding: 0 10px;
    min-width: 0;
  }
  .input:focus-visible,
  .textarea:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 0;
    border-color: var(--ring);
  }
  .textarea {
    width: 100%;
    min-height: 190px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    padding: 10px 12px;
    font: 13px/1.7 var(--font-mono);
    resize: vertical;
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    height: 26px;
    padding: 0 10px;
    border: 0;
    border-radius: 5px;
    background: none;
    color: var(--muted-foreground);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .seg button:hover {
    color: var(--foreground);
    background: var(--surface-hover);
  }
  .seg button[aria-pressed='true'] {
    background: var(--surface-muted);
    color: var(--strong-foreground);
    font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .seg button[aria-pressed='true'][data-tone='up'] {
    background: var(--info-muted);
    color: var(--info-muted-foreground);
    box-shadow: inset 0 0 0 1px var(--info-border);
  }
  .seg button[aria-pressed='true'][data-tone='down'] {
    background: var(--remote-muted);
    color: var(--remote);
    box-shadow: inset 0 0 0 1px var(--remote-border);
  }
  .seg button[aria-pressed='true'][data-tone='del'] {
    background: var(--destructive-muted);
    color: var(--destructive);
    box-shadow: inset 0 0 0 1px var(--destructive-border);
  }
  .seg.lg button {
    height: 30px;
    padding: 0 14px;
    font-size: 13px;
  }

  .callout {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--warning-border);
    background: var(--warning-muted);
    color: var(--foreground);
  }
  .callout .ic {
    color: var(--warning);
    margin-top: 2px;
  }
  .callout.danger {
    border-color: var(--destructive-border);
    background: var(--destructive-muted);
  }
  .callout.danger .ic {
    color: var(--destructive);
  }
  .callout .grow {
    flex: 1;
    min-width: 0;
  }
  .callout strong {
    display: block;
    color: var(--strong-foreground);
  }

  /* ---------- 同步页 ---------- */
  .sync-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sync-head h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.25;
  }
  .sync-head h1 em {
    font-style: normal;
    color: var(--warning);
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--muted-foreground);
  }
  .meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .meta .mono {
    font-size: 12px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
  }
  .search {
    position: relative;
    flex: 1 1 220px;
    max-width: 320px;
  }
  .search .ic {
    position: absolute;
    left: 10px;
    top: 9px;
    color: var(--muted-foreground);
  }
  .search input {
    width: 100%;
    padding-left: 32px;
  }
  .search kbd {
    position: absolute;
    right: 8px;
    top: 7px;
    font: 11px var(--font-mono);
    color: var(--muted-foreground);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    background: var(--surface-muted);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--surface);
    color: var(--muted-foreground);
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover {
    border-color: var(--border-strong);
    color: var(--foreground);
  }
  .chip b {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
  }
  .chip[aria-pressed='true'] {
    background: var(--strong-foreground);
    border-color: var(--strong-foreground);
    color: var(--surface);
  }
  .chip[aria-pressed='true'] b {
    color: var(--surface);
  }
  .chip.zero b {
    color: var(--muted-foreground);
    font-weight: 500;
  }
  .chip .ic {
    width: 13px;
    height: 13px;
  }
  .chip[data-k='conflict']:not([aria-pressed='true']):not(.zero) .ic {
    color: var(--warning);
  }
  .chip[data-k='del']:not([aria-pressed='true']):not(.zero) .ic {
    color: var(--destructive);
  }
  .chip[data-k='up']:not([aria-pressed='true']):not(.zero) .ic {
    color: var(--info-muted-foreground);
  }
  .chip[data-k='down']:not([aria-pressed='true']):not(.zero) .ic {
    color: var(--remote);
  }

  .groups {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .groups.busy {
    opacity: 0.55;
    pointer-events: none;
  }
  .group-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    min-height: 32px;
    padding: 0 4px 6px 12px;
  }
  .group-head .lead {
    width: 20px;
    display: flex;
    justify-content: center;
    color: var(--muted-foreground);
  }
  .group-head h2 {
    font-size: 13.5px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .group-head h2 .n {
    font-weight: 600;
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
  }
  .group-head .hint {
    font-size: 12.5px;
    color: var(--muted-foreground);
    flex: 1 1 200px;
    min-width: 0;
  }
  .group-head .bulk {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .g-conflict .lead {
    color: var(--warning);
  }
  .g-del .lead {
    color: var(--destructive);
  }
  .rows {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .g-conflict .rows {
    border-color: var(--warning-border);
  }
  .row + .row {
    border-top: 1px solid var(--border-muted);
  }
  .row-main {
    display: grid;
    grid-template-columns: 20px minmax(0, 250px) minmax(0, 1fr) auto 28px;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 8px 8px 8px 12px;
  }
  .row:hover .row-main {
    background: var(--surface-muted);
  }
  .row .lead {
    display: flex;
    justify-content: center;
    color: var(--muted-foreground);
  }
  .row .lead .pend {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px dashed var(--warning);
  }
  .row .lead .skip {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
  }
  .row .lead .ok {
    color: var(--primary);
  }
  .ident {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .ident .name {
    font-weight: 600;
    color: var(--strong-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ns {
    flex: none;
    font-size: 11.5px;
    line-height: 18px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    white-space: nowrap;
  }
  .newtag {
    flex: none;
    font-size: 11px;
    line-height: 16px;
    padding: 0 5px;
    border-radius: 4px;
    background: var(--primary-muted);
    color: var(--primary-muted-foreground);
    font-weight: 600;
  }
  .what {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 13px;
    color: var(--muted-foreground);
  }
  .what span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .what.up {
    color: var(--info-muted-foreground);
  }
  .what.down {
    color: var(--remote);
  }
  .what.del {
    color: var(--destructive);
  }
  .what.warn {
    color: var(--warning);
  }
  .what.off {
    color: var(--muted-foreground);
  }
  .what .because {
    color: var(--muted-foreground);
  }
  .row.dim .ident .name {
    color: var(--muted-foreground);
    font-weight: 500;
  }
  .more {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted-foreground);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .more:hover {
    background: var(--surface-hover);
    color: var(--foreground);
  }
  .more .ic {
    transition: transform 0.15s;
  }
  .more[aria-expanded='true'] .ic {
    transform: rotate(180deg);
  }
  .detail {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    gap: 14px 28px;
    padding: 12px 16px 16px 44px;
    background: var(--surface-muted);
    border-top: 1px solid var(--border-muted);
  }
  .detail h3 {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted-foreground);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .kv {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 4px 12px;
    font-size: 12.5px;
    align-items: center;
  }
  .kv dt {
    color: var(--muted-foreground);
  }
  .kv dd {
    margin: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kv dd .mono {
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tri {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .tri div {
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    padding: 7px 9px;
    min-width: 0;
  }
  .tri small {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted-foreground);
  }
  .tri small i {
    font-style: normal;
    font-weight: 600;
  }
  .tri .chg small i {
    color: var(--warning);
  }
  .tri .gone small i {
    color: var(--destructive);
  }
  .tri .same small i {
    color: var(--muted-foreground);
    font-weight: 500;
  }
  .tri code {
    display: block;
    margin-top: 2px;
    font: 12px var(--font-mono);
    color: var(--foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tri .gone code,
  .tri .none code {
    color: var(--muted-foreground);
  }
  .detail .warns {
    grid-column: 1/-1;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 12.5px;
    color: var(--warning);
    display: grid;
    gap: 2px;
  }
  .fold {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    background: none;
    color: var(--muted-foreground);
    font-size: 13px;
    text-align: left;
  }
  .fold:hover {
    background: var(--surface);
    color: var(--foreground);
  }
  .fold .ic {
    color: var(--success);
  }

  .hero-ok {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    border: 1px solid var(--success-border);
    background: var(--success-muted);
    border-radius: 12px;
  }
  .hero-ok .badge {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--success);
    color: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .hero-ok h2 {
    font-size: 17px;
  }
  .empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--muted-foreground);
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    display: grid;
    gap: 10px;
    justify-items: center;
  }
  .skel {
    height: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
  }
  .skel i {
    display: block;
    height: 10px;
    border-radius: 5px;
    background: var(--surface-hover);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    50% {
      opacity: 0.45;
    }
  }
  .scan {
    display: grid;
    gap: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
  }
  .scan .line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
  }
  .bar {
    height: 6px;
    border-radius: 3px;
    background: var(--surface-hover);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    border-radius: 3px;
    background: var(--primary);
    transition: width 0.25s;
  }

  .recovery {
    border: 1px solid var(--warning-border);
    background: var(--warning-muted);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    gap: 14px;
    max-width: 760px;
  }
  .recovery h2 {
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .recovery h2 .ic {
    color: var(--warning);
  }
  .recovery .steps {
    display: grid;
    gap: 6px;
    font-size: 13px;
  }
  .recovery .steps div {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .recovery .steps .done {
    color: var(--muted-foreground);
  }
  .recovery .steps .done .ic {
    color: var(--success);
  }
  .recovery .steps .todo .ic {
    color: var(--warning);
  }

  /* 提交栏 */
  .applybar {
    flex: none;
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px -8px rgba(15, 23, 42, 0.12);
  }
  .applybar .in {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px var(--gutter-r) 10px var(--gutter-l);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 20px;
    min-height: 60px;
  }
  .sum {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1 1 320px;
  }
  .sum .l1 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    font-size: 13.5px;
  }
  .sum .l1 strong {
    color: var(--strong-foreground);
  }
  .sum .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .sum .pill.up {
    color: var(--info-muted-foreground);
  }
  .sum .pill.down {
    color: var(--remote);
  }
  .sum .pill.del {
    color: var(--destructive);
  }
  .sum .l2 {
    font-size: 12.5px;
    color: var(--muted-foreground);
    display: flex;
    flex-wrap: wrap;
    gap: 2px 12px;
  }
  .sum .l2 span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .sum .l2 .warn {
    color: var(--warning);
  }
  .applybar .right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .ack {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--warning);
    font-weight: 500;
  }
  .prog {
    flex: 1 1 100%;
    display: grid;
    gap: 6px;
  }
  .prog .line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
  }
  .prog .line b {
    color: var(--strong-foreground);
  }

  /* ---------- 设置页 ---------- */
  .settings {
    display: grid;
    grid-template-columns: 168px minmax(0, 1fr);
    gap: 36px;
    align-items: start;
  }
  .snav {
    position: sticky;
    top: 8px;
    display: grid;
    gap: 2px;
  }
  .snav button {
    height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    background: none;
    text-align: left;
    color: var(--muted-foreground);
    font-weight: 500;
    white-space: nowrap;
  }
  .snav button:hover {
    background: var(--surface-hover);
    color: var(--foreground);
  }
  .snav button.on {
    color: var(--strong-foreground);
    font-weight: 600;
    background: var(--surface-hover);
  }
  .saved {
    margin-top: 12px;
    padding: 0 10px;
    font-size: 12px;
    color: var(--muted-foreground);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .saved .ic {
    color: var(--success);
  }
  .secs {
    display: grid;
    gap: 36px;
    min-width: 0;
  }
  .sec {
    display: grid;
    gap: 4px;
    scroll-margin-top: 8px;
  }
  .sec > h2 {
    font-size: 16px;
    font-weight: 650;
  }
  .sec > p {
    font-size: 13px;
    color: var(--muted-foreground);
    max-width: 46em;
    text-wrap: pretty;
  }
  .srows {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .srow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px 24px;
    align-items: center;
    padding: 12px 16px;
  }
  .srow + .srow {
    border-top: 1px solid var(--border-muted);
  }
  .srow .lab b {
    display: block;
    font-weight: 600;
    color: var(--strong-foreground);
  }
  .srow .lab small {
    display: block;
    font-size: 12.5px;
    color: var(--muted-foreground);
    max-width: 34em;
    text-wrap: pretty;
  }
  .srow .ctl {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .unit {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .unit input {
    width: 84px;
    height: 32px;
    border: 0;
    background: none;
    padding: 0 8px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .unit input:focus-visible {
    outline: 0;
  }
  .unit:focus-within {
    outline: 2px solid var(--ring);
    border-color: var(--ring);
  }
  .unit span {
    padding: 0 9px;
    height: 32px;
    display: flex;
    align-items: center;
    background: var(--surface-muted);
    border-left: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted-foreground);
    min-width: 52px;
    justify-content: center;
  }
  .unit.bad {
    border-color: var(--destructive);
  }
  .err {
    padding: 10px 16px;
    border-top: 1px solid var(--destructive-border);
    background: var(--destructive-muted);
    color: var(--destructive);
    font-size: 13px;
    border-radius: 0 0 10px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  input[type='number']::-webkit-inner-spin-button,
  input[type='number']::-webkit-outer-spin-button {
    appearance: none;
    margin: 0;
  }
  .vcard {
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .vcard .repo {
    font: 600 16px var(--font-mono);
    color: var(--strong-foreground);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    word-break: break-all;
  }
  .tag {
    font: 500 11.5px/18px var(--font-sans);
    padding: 0 7px;
    border-radius: 9px;
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    background: var(--surface-muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .tag.ok {
    border-color: var(--success-border);
    background: var(--success-muted);
    color: var(--success);
  }
  .vcard .sub {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--muted-foreground);
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
  }
  details.tech {
    border-top: 1px solid var(--border-muted);
    padding: 10px 16px;
  }
  details.tech summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted-foreground);
    font-weight: 500;
  }
  details.tech .kv {
    margin-top: 8px;
  }
  .meter {
    display: grid;
    gap: 6px;
    min-width: 220px;
  }
  .meter .bar {
    height: 8px;
    border-radius: 4px;
  }
  .srow .lab .meter small {
    max-width: none;
    font-size: 12.5px;
    color: var(--muted-foreground);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .root .path {
    font: 12px var(--font-mono);
    color: var(--muted-foreground);
    word-break: break-all;
  }
  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    display: inline-block;
  }
  .danger-zone {
    margin-top: 10px;
    border: 1px solid var(--destructive-border);
    border-radius: 10px;
    background: var(--surface);
  }

  /* ---------- 首次配置 ---------- */
  .ob {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
  }
  .ob-rail {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px var(--gutter-l);
    padding-right: 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow: auto;
  }
  .ob-rail h2 {
    font-size: 13px;
    color: var(--muted-foreground);
    font-weight: 500;
    margin-top: 6px;
  }
  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
  }
  .steps li {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 12px;
    position: relative;
    padding-bottom: 18px;
  }
  .steps li:last-child {
    padding-bottom: 0;
  }
  .steps li::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 24px;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .steps li:last-child::before {
    display: none;
  }
  .steps li.done::before {
    background: var(--primary);
  }
  .steps .mk {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    border: 2px solid var(--border-strong);
    color: var(--muted-foreground);
    background: var(--surface);
    z-index: 1;
    font-variant-numeric: tabular-nums;
  }
  .steps .done .mk {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .steps .cur .mk {
    border-color: var(--primary);
    color: var(--primary-muted-foreground);
    background: var(--primary-muted);
  }
  .steps b {
    display: block;
    font-weight: 500;
    color: var(--muted-foreground);
    line-height: 24px;
  }
  .steps .cur b {
    color: var(--strong-foreground);
    font-weight: 650;
  }
  .steps .done b {
    color: var(--foreground);
  }
  .steps small {
    display: block;
    font: 12px var(--font-mono);
    color: var(--muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ob-rail .foot {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ob-main {
    overflow: auto;
    padding: 48px var(--gutter-r) 40px 48px;
  }
  .panel {
    max-width: 580px;
    display: grid;
    gap: 18px;
  }
  .eyebrow {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-muted-foreground);
    letter-spacing: 0.04em;
  }
  .panel h1 {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .panel .lede {
    font-size: 15px;
    color: var(--muted-foreground);
    max-width: 36em;
    text-wrap: balance;
  }
  .acts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .box {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    padding: 16px;
    display: grid;
    gap: 12px;
  }
  .todo {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr);
    gap: 4px 12px;
    align-items: start;
  }
  .todo .n {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-foreground);
  }
  .todo b {
    line-height: 24px;
    color: var(--strong-foreground);
  }
  .todo p {
    grid-column: 2;
    font-size: 13px;
    color: var(--muted-foreground);
  }
  .todo .a {
    grid-column: 2;
    margin-top: 6px;
  }
  .code {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .code span {
    width: 38px;
    height: 48px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 22px var(--font-mono);
    color: var(--strong-foreground);
  }
  .code i {
    width: 10px;
    height: 2px;
    background: var(--border-strong);
  }
  .wait {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted-foreground);
  }
  .gh {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-muted);
    padding: 12px 14px;
    display: grid;
    gap: 8px;
    font-size: 13px;
  }
  .gh .cap {
    font-size: 11.5px;
    color: var(--muted-foreground);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .gh .opt {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .gh .radio {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    flex: none;
  }
  .gh .radio.on {
    border: 4px solid var(--primary);
  }
  .gh .no {
    color: var(--muted-foreground);
    text-decoration: line-through;
  }
  .gh .pick {
    margin-left: 22px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    border-radius: 6px;
    padding: 2px 8px;
    font: 12.5px var(--font-mono);
  }
  .gh .note {
    font-size: 12px;
    font-weight: 600;
  }
  .gh .note.good {
    color: var(--success);
  }
  .gh .note.bad {
    color: var(--destructive);
  }
  .perm {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-size: 12.5px;
    color: var(--muted-foreground);
  }
  .perm span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .perm .ic {
    color: var(--success);
  }
  .flow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.1fr) auto minmax(
        0,
        1fr
      );
    align-items: center;
    gap: 10px;
  }
  .node {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    padding: 12px;
    display: grid;
    gap: 4px;
    justify-items: start;
    min-width: 0;
  }
  .node.v {
    border-color: var(--primary-border);
    background: var(--primary-muted);
  }
  .node b {
    font-size: 13px;
    color: var(--strong-foreground);
    display: flex;
    align-items: center;
    gap: 6px;

        (c === 'delete' && e.status === 'remote_deleted')
      )
        return 'delLocal'
      return null
    }
    function summary() {
      const s = { up: 0, down: 0, delRemote: 0, delLocal: 0, undecided: 0 }
      for (const e of S.entries) {
        const k = effect(e)
        if (k) s[k]++
        else if (e.status === 'conflict' && !S.decisions[e.id]) s.undecided++
      }
      s.n = s.up + s.down + s.delRemote + s.delLocal
      s.hasDel = s.delRemote + s.delLocal > 0
      s.commit = s.up > 0 || s.delRemote > 0
      return s
    }
    const counts = () => {
      const c = { conflict: 0, del: 0, up: 0, down: 0, blocked: 0, synced: 0 }
      for (const e of S.entries) c[kind(e)]++
      c.pending = c.conflict + c.del + c.up + c.down
      return c
    }
    const kind = (e) =>
      e.status === 'conflict'
        ? 'conflict'
        : isDel(e)
          ? 'del'
          : e.status === 'local_update'
            ? 'up'
            : e.status === 'remote_update'
              ? 'down'
              : e.status === 'blocked'
                ? 'blocked'
                : 'synced'

    /* ===================== 渲染：外壳 ===================== */
    const OB_STAGES = {
      intro: '欢迎页',
      authorize: '1 授权 GitHub',
      device_pending: '1 等待验证码授权',
      create_repository: '2 新建 Vault 仓库',
      install_app: '3 安装 GitHub App',
      repository_scope_blocked: '3 授权范围过大',
      confirm_public_repository: '4 公开仓库确认',
      select_branch: '4 选择分支',
      checking_vault: '4 正在检查',
      vault_unavailable: '4 Vault 不可用',
      confirm_initialize: '5 初始化 Vault',
      invalid_manifest: '5 manifest 无效',
      rate_limited: '5 API 受限',
      ready: '6 完成绑定',
      rebind: '6 切换 Vault（重新配置）',
    }
    function proto() {
      const opt = (o, cur) =>
        Object.entries(o)
          .map(
            ([k, v]) =>
              `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(v.label || v)}</option>`,
          )
          .join('')
      return `<div class="proto"><b>原型演示</b>
    <label>界面<select id="p-route" data-change="route"><option value="sync"${S.route !== 'onboarding' ? ' selected' : ''}>主应用（同步 / 设置）</option><option value="onboarding"${S.route === 'onboarding' ? ' selected' : ''}>首次配置流程</option></select></label>
    ${
      S.route === 'onboarding'
        ? `<label>步骤<select id="p-ob" data-change="ob">${opt(OB_STAGES, S.ob.rebind && S.ob.stage === 'ready' ? 'rebind' : S.ob.stage)}</select></label>`
        : `<label>同步页场景<select id="p-sc" data-change="scenario">${opt(SCENARIOS, S.scenario)}</select></label>`
    }
    <span class="sp"></span>
    <label>主题<select id="p-theme" data-change="theme">${[
      ['system', '跟随系统'],
      ['light', '亮色'],
      ['dark', '暗色'],
    ]
      .map(
        ([k, v]) =>
          `<option value="${k}"${S.theme === k ? ' selected' : ''}>${v}</option>`,
      )
      .join('')}</select></label>
    <span>示例数据，非真实扫描结果</span></div>`
    }
    function top() {
      const c = counts(),
        attn = c.conflict + c.del
      return `<header class="top">
    <div class="brand">${LOGO}<span>Skill Sync</span></div>
    <nav class="tabs" aria-label="应用导航">
      <button class="tab" data-act="go" data-id="sync" ${S.route === 'sync' ? 'aria-current="page"' : ''}>${ic('swap')}同步${attn && !S.recovery ? `<span class="dot num" title="${attn} 项需要你决定">${attn}</span>` : ''}</button>
      <button class="tab" data-act="go" data-id="settings" ${S.route === 'settings' ? 'aria-current="page"' : ''}>${ic('sliders')}设置</button>
    </nav>
    <span class="sp"></span>
    <button class="vault" data-act="go-sec" data-id="vault" title="查看 Vault 设置"><span class="led"></span><span class="repo">${VAULT.owner}/${VAULT.repo}</span><span class="br">${VAULT.branch}</span></button>
  </header>`
    }
    function render() {
      const a = document.activeElement,
        key = a && a.dataset && a.dataset.act ? keyOf(a) : null
      const sc = $('.view') ? $('.view').scrollTop : 0,
        keep = $('.view') && $('.view').dataset.r === S.route
      const app = $('#app')
      if (S.route === 'onboarding') app.innerHTML = proto() + onboarding()
      else
        app.innerHTML =
          proto() +
          top() +
          `<main class="view" data-r="${S.route}">${S.route === 'sync' ? syncPage() : settingsPage()}</main>` +
          (S.route === 'sync' ? applyBar() : '')
      if (keep && $('.view')) $('.view').scrollTop = sc
      document
        .querySelectorAll('[data-ind="1"]')
        .forEach((el) => (el.indeterminate = true))
      if (key) {
        const el = [...document.querySelectorAll('[data-act]')].find(
          (e) => keyOf(e) === key,
        )
        el && el.focus({ preventScroll: true })
      }
      if (S.route === 'settings') watchSections()
    }
    const keyOf = (el) =>
      [el.dataset.act, el.dataset.id, el.dataset.v].join('|')

    /* ===================== 渲染：同步页 ===================== */
    function syncPage() {
      if (S.recovery) return `<div class="page">${recoveryView()}</div>`
      const c = counts(),
        total = S.entries.length
      let h1,
        sub = ''
      if (S.loading) h1 = '正在检查变更…'
      else if (S.error) h1 = '无法加载同步计划'
      else if (c.pending === 0) h1 = '全部已同步'
      else {
        const attn = S.entries.filter(
          (e) =>
            (e.status === 'conflict' && !S.decisions[e.id]) ||
            (isDel(e) && choiceOf(e) === 'none'),
        ).length
        h1 = `${c.pending} 项变更待处理${attn ? `，<em>还有 ${attn} 项等你决定</em>` : ''}`
      }
      return `<div class="page">
    <header class="sync-head">
      <div><h1>${h1}</h1>
        <div class="meta">
          <span>${ic('laptop', 'sm')}本机 ${VAULT.device} · <span class="num">${total || '—'}</span> 个 skills</span>
          <span>${ic('commit', 'sm')}云端版本 <span class="mono">${S.commit.slice(0, 7)}</span></span>
          <span>${ic('clock', 'sm')}${S.loading ? '检查中' : '上次检查 ' + S.checked}</span>
        </div></div>
      <button class="btn" data-act="recheck" ${S.loading || S.applying ? 'disabled' : ''}>${ic(S.loading ? 'loader' : 'refresh', S.loading ? 'spin' : '')}重新检查</button>
    </header>
    ${
      S.loading
        ? loadingView()
        : S.error
          ? errorView()
          : `
      ${S.notice ? `<div class="callout">${ic('info')}<div class="grow">${esc(S.notice)}</div><button class="btn ghost sm icon" data-act="dismiss" aria-label="关闭提示">${ic('x')}</button></div>` : ''}
      ${S.guard ? `<div class="callout">${ic('alert')}<div class="grow"><strong>删除数量异常</strong>本次计划包含 ${c.del} 项删除，超过自动删除上限 ${S.cfg.autoDel}。请确认 Skill 目录可读、删除符合预期；执行前需要在底部勾选确认。</div></div>` : ''}
      ${c.pending === 0 && c.blocked === 0 ? '' : toolbar(c)}
      <div id="list">${listView(c)}</div>`
    }
  </div>`
    }
    function toolbar(c) {
      const chip = (k, label, n, icon) =>
        `<button class="chip${n ? '' : ' zero'}" data-act="filter" data-id="${k}" data-k="${k}" aria-pressed="${S.filter === k}">${icon ? ic(icon) : ''}${label}<b>${n}</b></button>`
      return `<div class="toolbar">
    <div class="search">${ic('search')}<input class="input" id="q" type="search" placeholder="搜索名称、工具或路径" value="${esc(S.search)}" autocomplete="off" aria-label="搜索 skill">${S.search ? '' : '<kbd>/</kbd>'}</div>
    <div class="chips" role="group" aria-label="按状态筛选">
      ${chip('pending', '待处理', c.pending)}${chip('conflict', '冲突', c.conflict, 'alert')}${chip('del', '删除', c.del, 'trash')}${chip('up', '上传', c.up, 'up')}${chip('down', '下载', c.down, 'down')}${chip('synced', '已同步', c.synced, 'check')}
    </div></div>`
    }
    function listView(c) {
      c = c || counts()
      const q = S.search.trim().toLowerCase()
      const E = S.entries.filter(
        (e) =>
          !q ||
          [e.name, e.id, NS[e.ns].label, e.path || ''].some((v) =>
            v.toLowerCase().includes(q),
          ),
      )
      const by = (k) => E.filter((e) => kind(e) === k),
        show = (k) =>
          S.filter === 'pending'
            ? k !== 'synced'
            : S.filter === k || (k === 'blocked' && false)
      const G = {
        conflict: by('conflict'),
        del: by('del'),
        up: by('up'),
        down: by('down'),
        blocked: by('blocked'),
        synced: by('synced'),
      }
      let html = ''
      if (c.pending === 0 && !q && S.filter === 'pending')
        html += `<div class="hero-ok"><span class="badge">${ic('check', 'lg')}</span><div><h2>${c.synced} 个 skills 与 Vault 一致</h2><p class="muted">没有需要上传、下载或删除的内容。在任意一台机器上修改 skill 后，回到这里点“重新检查”。</p></div></div>`
      if (show('conflict') && G.conflict.length)
        html += group(
          'conflict',
          'alert',
          '需要你决定',
          G.conflict,
          '两边都有改动，Skill Sync 不会替你选。未决定的项本次跳过。',
          `<button class="btn sm" data-act="bulk" data-id="conflict" data-v="local">${ic('up', 'sm')}全部保留本地</button><button class="btn sm" data-act="bulk" data-id="conflict" data-v="remote">${ic('down', 'sm')}全部使用云端</button>`,
        )
      if (show('del') && G.del.length)
        html += group(
          'del',
          'trash',
          '删除',
          G.del,
          '删除不会自动执行，逐项确认后才生效。本地删除会移入回收目录。',
          `<button class="btn sm danger" data-act="bulk" data-id="del" data-v="delete">${ic('trash', 'sm')}全部确认删除</button><button class="btn sm" data-act="bulk" data-id="del" data-v="recover">${ic('undo', 'sm')}全部恢复</button><button class="btn sm ghost" data-act="bulk" data-id="del" data-v="none">全部暂不处理</button>`,
        )
      if (show('up') && G.up.length)
        html += group('up', null, '上传', G.up, '本地 → 云端')
      if (show('down') && G.down.length)
        html += group('down', null, '下载', G.down, '云端 → 本地')
      if (S.filter === 'pending' && G.blocked.length)
        html += group(
          'blocked',
          'ban',
          '无法同步',
          G.blocked,
          '解决阻止原因后重新检查。',
        )
      if (S.filter === 'synced' || q) {
        if (G.synced.length)
          html += group(
            'synced',
            'check',
            '已同步',
            G.synced,
            '与云端一致，无需操作',
          )
      } else if (S.filter === 'pending' && c.synced)
        html += S.syncedOpen
          ? group(
              'synced',
              'check',
              '已同步',
              G.synced,
              '与云端一致，无需操作',
              `<button class="btn sm ghost" data-act="toggle-synced">收起</button>`,
            )
          : `<button class="fold" data-act="toggle-synced">${ic('check')}<span><b class="num">${c.synced}</b> 个 skill 已同步，无需操作</span><span style="flex:1"></span>${ic('chev')}</button>`
      if (!html)
        html = `<div class="empty"><p>${q ? `没有匹配“${esc(S.search)}”的 skill` : '这个分类下没有条目'}</p><button class="btn sm" data-act="clear-filter">清除筛选</button></div>`
      return `<div class="groups${S.applying ? ' busy' : ''}">${html}</div>`
    }
    function group(k, icon, title, rows, hint, bulk = '') {
      let lead = icon ? ic(icon) : ''
      if (k === 'up' || k === 'down') {
        const on = rows.filter((e) => S.selected.has(e.action)).length
        lead = `<input type="checkbox" data-act="group-check" data-id="${k}" aria-label="选择全部${title}" ${on === rows.length ? 'checked' : ''} ${on && on < rows.length ? 'data-ind="1"' : ''}>`
      }
      return `<section class="g-${k}"><div class="group-head"><span class="lead">${lead}</span><h2>${title}<span class="n">${rows.length}</span></h2><span class="hint">${hint}</span><div class="bulk">${bulk}</div></div>
    <div class="rows">${rows.map(row).join('')}</div></section>`
    }
    function row(e) {
      const k = kind(e),
        open = S.open.has(e.id),
        c = choiceOf(e),
        eff = effect(e)
      let lead,
        what,
        act = ''
      if (isSimple(e)) {
        const on = S.selected.has(e.action)
        lead = `<input type="checkbox" data-act="check" data-id="${esc(e.id)}" aria-label="选择 ${esc(e.name)}" ${on ? 'checked' : ''}>`
        const why =
          e.status === 'local_update'
            ? e.isNew
              ? '云端尚无此 skill'
              : '本地已修改'
            : e.isNew
              ? '本机尚无此 skill'
              : '云端已修改'
        what = on
          ? `<div class="what ${k}">${ic(k)}<span>${k === 'up' ? '上传到云端' : '下载到本地'} <span class="because">· ${why}</span></span></div>`
          : `<div class="what off"><span>本次跳过 · ${why}</span></div>`
      } else if (k === 'conflict' || k === 'del') {
        const base =
          k === 'conflict'
            ? REASON[e.reason]
            : e.status === 'local_deleted'
              ? '本地已删除，云端仍保留'
              : '云端已删除，本地仍保留'
        const OUT = {
          up: [
            'up',
            'up',
            e.status === 'remote_deleted'
              ? '重新上传到云端'
              : '用本地版本覆盖云端',
          ],
          down: [
            'down',
            'down',
            e.local ? '用云端版本覆盖本地' : '从云端重新下载',
          ],
          delRemote: ['del', 'trash', '从云端删除'],
          delLocal: ['del', 'trash', '删除本地（移入回收目录）'],
        }
        lead = eff
          ? `<span class="ok">${ic('check')}</span>`
          : k === 'conflict' && !c
            ? '<span class="pend" title="待决定"></span>'
            : '<span class="skip" title="本次跳过"></span>'
        what = eff
          ? `<div class="what ${OUT[eff][0]}">${ic(OUT[eff][1])}<span>${OUT[eff][2]} <span class="because">· ${base}</span></span></div>`
          : `<div class="what ${k === 'conflict' && !c ? 'warn' : 'off'}"><span>${base}${c === 'skip' ? ' · 本次跳过' : ''}</span></div>`
        act = `<div class="seg" role="group" aria-label="${esc(e.name)} 的处理方式">${options(
          e,
        )
          .map(
            ([v, label, tone]) =>
              `<button data-act="choose" data-id="${esc(e.id)}" data-v="${v}" data-tone="${tone}" aria-pressed="${c === v}">${label}</button>`,
          )
          .join('')}</div>`
      } else if (k === 'blocked') {
        lead = `<span style="color:var(--destructive)">${ic('ban')}</span>`
        what = `<div class="what del"><span>${esc(e.blocked)}</span></div>`
        act = `<button class="btn sm" data-act="go-sec" data-id="limits">调整资源限制</button>`
      } else {
        lead = `<span style="color:var(--success)">${ic('check')}</span>`
        what = `<div class="what off"><span class="mono" style="font-size:12px">${esc(e.path)}</span></div>`
      }
      return `<div class="row${!eff && k !== 'synced' && k !== 'blocked' && !(k === 'conflict' && !c) ? ' dim' : ''}">
    <div class="row-main"><span class="lead">${lead}</span>
      <div class="ident"><span class="name" title="${esc(e.id)}">${esc(e.name)}</span><span class="ns">${NS[e.ns].label}</span>${e.isNew ? '<span class="newtag">新增</span>' : ''}${e.warnings.length ? `<span style="color:var(--warning);display:flex" title="${e.warnings.length} 条提示">${ic('info', 'sm')}</span>` : ''}</div>
      ${what}<div class="act">${act}</div>
      <button class="more" data-act="toggle" data-id="${esc(e.id)}" aria-expanded="${open}" aria-label="${open ? '收起' : '展开'} ${esc(e.name)} 的详情">${ic('chev')}</button></div>
    ${open ? detail(e) : ''}</div>`
    }
    function detail(e) {
      const cell = (label, h, isBase) => {
        let cls, st
        if (isBase) {
          cls = h ? 'same' : 'none'
          st = h ? '上次同步' : '从未同步'
        } else if (!h) {
          cls = e.base ? 'gone' : 'none'
          st = e.base ? '已删除' : '不存在'
        } else if (h === e.base) {
          cls = 'same'
          st = '未变'
        } else {
          cls = 'chg'
          st = e.base ? '已修改' : '新增'
        }
        return `<div class="${cls}"><small>${label}<i>${st}</i></small><code>${short(h)}</code></div>`
      }
      return `<div class="detail">
    <div><h3>位置</h3><dl class="kv">
      <dt>Skill ID</dt><dd><span class="mono">${esc(e.id)}</span></dd>
      <dt>本地路径</dt><dd>${e.path ? `<span class="mono" title="${esc(e.path)}">${esc(e.path)}</span><button class="btn ghost sm icon" data-act="open-folder" data-id="${esc(e.id)}" title="打开目录" aria-label="打开目录">${ic('folder', 'sm')}</button><button class="btn ghost sm icon" data-act="copy" data-v="${esc(e.path)}" title="复制路径" aria-label="复制路径">${ic('copy', 'sm')}</button>` : '<span class="muted">本机不存在</span>'}</dd>
    </dl></div>
    <div><h3>内容 hash 三方对比</h3><div class="tri">${cell('基线', e.base, true)}${cell('本地', e.local)}${cell('云端', e.remote)}</div></div>
    ${e.warnings.length ? `<ul class="warns">${e.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}</div>`
    }
    function loadingView() {
      const L = S.loading,
        pct = Math.round((L.cur / L.total) * 100)
      return `<div class="scan" aria-live="polite"><div class="line"><b>${L.cur < L.total ? '扫描 skills' : '准备 skill 包'}</b><span class="muted num">${L.cur}/${L.total}</span></div><div class="bar"><i style="width:${pct}%"></i></div><small class="muted">缓存：复用 ${Math.max(0, L.cur - 3)} 项，重新计算 ${Math.min(3, L.cur)} 项</small></div>
    <div class="rows">${[62, 48, 70, 40, 56].map((w) => `<div class="skel"><i style="width:16px;height:16px"></i><i style="width:${w * 2}px"></i><i style="width:${w}px"></i><span style="flex:1"></span><i style="width:140px"></i></div>`).join('')}</div>`
    }
    function errorView() {
      return `<div class="callout danger">${ic('alert')}<div class="grow"><strong>加载同步计划失败</strong>无法连接 api.github.com（请求超时）。检查网络或代理后重试；本地文件没有被改动。</div><button class="btn sm" data-act="recheck">${ic('refresh', 'sm')}重试</button></div>`
    }
    function recoveryView() {
      const r = S.recovery
      return `<header class="sync-head"><div><h1>上次同步中断，需要先恢复</h1><div class="meta"><span>恢复完成前不能开始新的同步，已完成的步骤不会重复执行。</span></div></div></header>
    <div class="recovery"><h2>${ic('alert', 'lg')}本地文件替换未完成</h2><p>${esc(r.message)}</p>
      <div class="steps"><div class="done">${ic('check')}已完成 ${r.done} 个动作（含云端 commit <span class="mono">${S.commit.slice(0, 7)}</span>）</div><div class="todo">${ic('clock')}待完成 ${r.pending} 个动作</div></div>
      <div class="bar"><i style="width:${(r.done / (r.done + r.pending)) * 100}%;background:var(--warning)"></i></div>
      <div class="acts"><button class="btn primary" data-act="resume" ${r.busy ? 'disabled' : ''}>${r.busy ? ic('loader', 'spin') : ''}继续恢复</button><span class="muted" style="font-size:12.5px">阶段：${r.phase}</span></div></div>`
    }
    function applyBar() {
      if (S.recovery || S.error || S.loading) return ''
      const c = counts()
      if (c.pending === 0 && !S.applying) return ''
      if (S.applying) {
        const A = S.applying
        return `<footer class="applybar"><div class="in"><div class="prog" aria-live="polite"><div class="line"><span><b>${A.label}</b>${A.of ? ` <span class="num muted">${A.i}/${A.of}</span>` : ''}${A.skill ? ` <span class="mono muted" style="font-size:12px">${esc(A.skill)}</span>` : ''}</span><span class="muted">同步中，请勿关闭应用</span></div><div class="bar"><i style="width:${A.pct}%"></i></div></div></div></footer>`
      }
      const s = summary(),
        needAck = S.guard && s.hasDel,
        can = (s.n > 0 || S.baseUpdates > 0) && (!needAck || S.guardAck)
      const pill = (k, icon, n, label) =>

            S.sec = cur
            document

          }
        },
        { passive: true },
      )

          return `${eyebrow(6)}<div class="statusico">${ic('check', 'lg')}</div><h1>Vault 已就绪</h1>
      <p class="lede">确认下面的信息无误后绑定。绑定后会进入同步页，你可以先预览再决定上传或下载什么。</p>
      <div class="box"><dl class="kv"><dt>仓库</dt><dd><span class="mono">${repo}</span><span class="tag">${ic('lock', 'sm')}私有</span></dd><dt>分支</dt><dd><span class="mono">${o.branch}</span></dd><dt>GitHub 用户</dt><dd>@${VAULT.user}</dd></dl></div>
      ${o.rebind ? `<div class="callout">${ic('alert')}<label class="grow" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="rebind-ok" data-act="ob-rebind-ok" ${o.rebindOk ? 'checked' : ''} style="margin-top:3px"><span><strong>你正在切换到另一个 Vault</strong>我确认切换，并归档当前本机同步基线。</span></label></div>` : ''}
      <div class="acts">${busyBtn('绑定此 Vault', 'ob-bind', o)}</div>`
      }
      return ''
    }
    const countdown = () => {
      const s = Math.max(0, Math.round((S.ob.expires - Date.now()) / 1000))
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
    }
    setInterval(() => {
      const el = $('#cd')
      if (el) el.textContent = countdown()
    }, 1000)
    function obGo(stage, msg = '') {
      S.ob.stage = stage
      S.ob.msg = msg
      S.ob.busy = false
      render()
      const m = $('.ob-main')
      if (m) m.scrollTop = 0
    }
    function obBusy(ms, then) {
      S.ob.busy = true
      S.ob.msg = ''
      render()
      setTimeout(() => {
        S.ob.busy = false
        then()
      }, ms)
    }

    /* ===================== 浮层 ===================== */
    function toast(msg, icon = 'check') {
      const t = document.createElement('div')
      t.className = 'toast'
      t.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`
      $('#toasts').append(t)
      setTimeout(() => t.remove(), 3200)
    }
    let modalCb = null
    function modal(title, body, label, cb, danger = true) {
      modalCb = cb
      $('#modal').innerHTML =
        `<div class="scrim" data-act="modal-x"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">${title}</h2><p>${body}</p><div class="acts"><button class="btn" data-act="modal-x">取消</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-act="modal-ok">${label}</button></div></div></div>`
      $('#modal .btn').focus()
    }
    const closeModal = () => {
      $('#modal').innerHTML = ''
      modalCb = null
    }

    /* ===================== 模拟：检查 / 执行 ===================== */
    function recheck() {
      if (S.error) {
        S.error = false
        S.scenario = 'pending'
      }
      const total = S.entries.length || SCENARIOS.pending.entries().length
      S.loading = { cur: 0, total }
      S.notice = ''
      render()
      const t = setInterval(() => {
        S.loading.cur = Math.min(total, S.loading.cur + Math.ceil(total / 9))
        if (S.loading.cur >= total) {
          clearInterval(t)
          setTimeout(() => {
            const k = S.scenario
            if (!S.entries.length) loadScenario(k === 'error' ? 'pending' : k)
            S.loading = null
            S.checked = '刚刚'
            render()
          }, 350)
        }
        render()
      }, 160)
    }
    function apply() {
      const s = summary(),
        names = (k) =>
          S.entries.filter((e) => effect(e) === k).map((e) => e.id),
        steps = []
      const add = (label, ids) =>
        ids.forEach((id, i) =>
          steps.push({ label, skill: id, i: i + 1, of: ids.length }),
        )
      add('准备 skill 包', names('up'))
      add('应用下载内容', names('down'))
      add('删除本地 skill', names('delLocal'))
      add('准备上传内容', names('up'))
      add('准备删除云端内容', names('delRemote'))
      if (s.commit) steps.push({ label: '发布一个 GitHub commit' })
      steps.push({ label: '保存同步状态' }, { label: '清理临时文件' })
      let i = 0
      const tick = () => {
        if (i >= steps.length) return finish(s)
        S.applying = {
          ...steps[i],
          pct: Math.round(((i + 1) / steps.length) * 100),
        }
        i++
        render()
        setTimeout(tick, 300)
      }
      tick()
    }
    function finish(s) {
      S.entries = S.entries.flatMap((e) => {
        const k = effect(e)
        if (!k) return [e]
        if (k === 'delRemote' || k === 'delLocal') return []
        const h = k === 'up' ? e.local : e.remote
        return [
          {
            ...e,
            status: 'synced',
            reason: null,
            isNew: false,
            base: h,
            local: h,
            remote: h,
            path: NS[e.ns].root + '\\' + e.name,
            warnings: [],
          },
        ]
      })
      if (s.commit) S.commit = hash(S.commit + Date.now()).slice(0, 10)
      S.selected = new Set()
      S.decisions = {}
      S.applying = null
      S.guardAck = false
      S.baseUpdates = 0
      S.notice = ''
      S.checked = '刚刚'
      if (!S.entries.some(isDel)) S.guard = false
      render()
      toast(
        `同步完成：应用 ${s.n} 项${s.commit ? '，已创建 commit ' + S.commit.slice(0, 7) : ''}`,
      )
    }

    /* ===================== 事件 ===================== */
    const entry = (id) => S.entries.find((e) => e.id === id)
    function applyTheme() {
      const r = document.documentElement
      S.theme === 'system'
        ? r.removeAttribute('data-theme')
        : r.setAttribute('data-theme', S.theme)
    }
    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]')
      if (!el) return
      const { act, id, v } = el.dataset,
        e = id && entry(id)
      if (act === 'modal-x') {
        if (ev.target === el) closeModal()
        return
      }
      if (act === 'modal-ok') {
        const cb = modalCb
        closeModal()
        cb && cb()
        return
      }
      switch (act) {
        case 'go':
          S.route = id
          break
        case 'go-sec':
          S.route = 'settings'
          S.sec = id
          render()
          requestAnimationFrame(() => {
            const t = $('#sec-' + id)
            t && t.scrollIntoView({ block: 'start' })
          })
          return
        case 'sec':
          S.sec = id
          $('#sec-' + id).scrollIntoView({ behavior: 'smooth', block: 'start' })
          document
            .querySelectorAll('.snav button')
            .forEach((b) => b.classList.toggle('on', b.dataset.id === id))
          return
        case 'filter':
          S.filter = id
          break
        case 'clear-filter':
          S.filter = 'pending'
          S.search = ''
          break
        case 'toggle':
          S.open.has(id) ? S.open.delete(id) : S.open.add(id)
          break
        case 'toggle-synced':
          S.syncedOpen = !S.syncedOpen
          break
        case 'check':
          el.checked ? S.selected.add(e.action) : S.selected.delete(e.action)
          break
        case 'group-check':
          S.entries
            .filter((x) => kind(x) === id)
            .forEach((x) =>
              el.checked
                ? S.selected.add(x.action)
                : S.selected.delete(x.action),
            )
          break
        case 'choose':
          setChoice(e, v)
          break
        case 'bulk':
          S.entries
            .filter((x) => kind(x) === id)
            .forEach((x) => {
              if (id === 'conflict') {
                S.decisions[x.id] =
                  v === 'remote'
                    ? x.reason === 'local_deleted_remote_changed'
                      ? 'restore_remote'
                      : x.reason === 'remote_deleted_local_changed'
                        ? 'accept_delete'
                        : 'use_remote'
                    : x.reason === 'local_deleted_remote_changed'
                      ? 'delete_remote'
                      : 'keep_local'
              } else
                setChoice(
                  x,
                  v === 'recover'
                    ? x.status === 'local_deleted'
                      ? 'restore_remote'
                      : 'keep_local'
                    : v,
                )
            })
          break
        case 'ack':
          S.guardAck = el.checked
          break
        case 'dismiss':
          S.notice = ''
          break
        case 'recheck':
          recheck()
          return
        case 'apply':
          apply()
          return
        case 'resume':
          S.recovery.busy = true
          render()
          setTimeout(() => {
            loadScenario('synced')
            S.scenario = 'synced'
            render()
            toast('同步恢复已完成。')
          }, 1400)
          return
        case 'copy':
          navigator.clipboard &&
            navigator.clipboard.writeText(v).catch(() => {})
          toast(v.includes('\\') ? '路径已复制' : '验证码已复制')
          return
        case 'open-folder':
          toast('（原型）将在资源管理器中打开 ' + e.path, 'folder')
          return
        case 'open-root':
          toast('（原型）将在资源管理器中打开 ' + NS[id].root, 'folder')
          return
        case 'star':
          toast('（原型）将打开 github.com/TreatTrick/skill-sync', 'ext')
          return
        case 'theme':
          S.theme = v
          applyTheme()
          break
        case 'lang':
          if (v === 'en') {
            toast('原型只做了中文；实现时沿用现有 i18n 双语', 'info')
            return
          }
          break
        case 'clear-cache':
          modal(
            '清空 skill 包缓存？',
            '只会删除本机可重建的缓存包，不影响同步状态和云端内容。下一次检查会慢一些。',
            '清空缓存',
            () => {
              S.cache.entries = 0
              S.cache.bytes = 0
              render()
              toast('Skill 包缓存已清空。')
            },
          )
          return
        case 'disconnect':
          modal(
            '断开 GitHub 连接？',
            '将清除本机授权并归档本机同步基线。不会卸载 GitHub App，也不会删除远端内容。之后需要重新走一遍配置流程。',
            '断开 GitHub',
            () => {
              S.route = 'onboarding'
              S.ob = {
                ...S.ob,
                stage: 'intro',
                msg: '',
                rebind: false,
                reconfigure: false,
              }
              render()
            },
          )
          return
        case 'reconfigure':
          S.route = 'onboarding'
          S.ob = {
            ...S.ob,
            stage: 'install_app',
            msg: '',
            rebind: true,
            rebindOk: false,
            reconfigure: true,
          }
          break
        case 'cancel-reconfigure':
          S.route = 'sync'
          break
        /* onboarding */
        case 'ob-next':
          obGo(id)
          return
        case 'ob-start':
          obBusy(700, () => {
            S.ob.expires = Date.now() + 899000
            obGo('device_pending')
          })
          return
        case 'ob-verify':
          toast(
            '（原型）已打开 github.com/login/device，2 秒后模拟授权完成',
            'ext',
          )
          setTimeout(() => {
            if (S.ob.stage === 'device_pending') obGo('create_repository')
          }, 2200)
          return
        case 'ob-open':
          toast('（原型）将在浏览器打开 ' + v, 'ext')
          return
        case 'ob-check-install':
          obBusy(1000, () => obGo('select_branch'))
          return
        case 'ob-next-busy':
          obBusy(800, () => obGo('select_branch'))
          return
        case 'ob-check-vault':
          obBusy(500, () => {
            obGo('checking_vault')
            setTimeout(() => {
              if (S.ob.stage === 'checking_vault')
                obGo(S.ob.rebind ? 'ready' : 'confirm_initialize')
            }, 1200)
          })
          return
        case 'ob-init':
          obBusy(1100, () => obGo('ready'))
          return
        case 'ob-rebind-ok':
          S.ob.rebindOk = el.checked
          return
        case 'ob-bind':
          if (S.ob.rebind && !S.ob.rebindOk) {
            S.ob.msg = '切换到其他 Vault 前必须确认归档当前本机同步基线。'
            render()
            return
          }
          obBusy(1100, () => {
            loadScenario('pending')
            S.route = 'sync'
            S.ob.rebind = false
            S.ob.reconfigure = false
            render()
            toast('Vault 已绑定，已建立 43 个 skill 的本地同步基线')
          })
          return
      }
      render()
    })
    document.addEventListener('change', (ev) => {
      const el = ev.target.closest('[data-change]')
      if (!el) return
      const k = el.dataset.change,
        v = el.value
      if (k === 'route') {
        S.route = v
        if (v === 'onboarding')
          S.ob = {
            ...S.ob,
            stage: 'intro',
            msg: '',
            rebind: false,
            reconfigure: false,
          }
      }
      if (k === 'scenario') {
        loadScenario(v)
        S.route = 'sync'
      }
      if (k === 'theme') {
        S.theme = v
        applyTheme()
      }
      if (k === 'branch') {
        S.ob.branch = v
      }
      if (k === 'ob') {
        S.ob.msg = ''
        S.ob.busy = false
        S.ob.rebind = v === 'rebind'
        S.ob.rebindOk = false
        S.ob.reconfigure = v === 'rebind'
        S.ob.stage = v === 'rebind' ? 'ready' : v
        S.ob.expires = Date.now() + 899000
        if (v === 'repository_scope_blocked')
          S.ob.msg =
            '当前 installation 包含 7 个仓库，必须调整为只授权一个 vault 仓库。'
      }
      render()
    })
    document.addEventListener('input', (ev) => {
      const el = ev.target
      if (el.id === 'q') {
        S.search = el.value
        $('#list').innerHTML = listView()
        const k = el.parentElement.querySelector('kbd')
        if (k) k.hidden = !!S.search
        return
      }
      if (el.dataset.input === 'ignore') {
        S.cfg.ignore = el.value
        autosave()
        return
      }
      if (el.dataset.input === 'limit') {
        const was = S.cfg.single > S.cfg.total
        S.cfg[el.dataset.id] = Math.max(0, Number(el.value) || 0)
        const bad = S.cfg.single > S.cfg.total
        if (was !== bad) {
          const id = el.id,
            pos = el.value.length
          render()
          const n = document.getElementById(id)
          n && n.focus()
        }
        if (!bad) autosave()
      }
    })
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && $('#modal').innerHTML) return closeModal()
      if (
        ev.key === '/' &&
        S.route === 'sync' &&
        !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)
      ) {
        const q = $('#q')
        if (q) {
          ev.preventDefault()
          q.focus()
        }
      }
    })

    /* ===================== 启动（#route=settings&scenario=guard&theme=dark&ob=ready 可直达某个状态） ===================== */
    const H = new URLSearchParams(location.hash.slice(1))
    loadScenario(SCENARIOS[H.get('scenario')] ? H.get('scenario') : 'pending')
    if (H.get('theme')) {
      S.theme = H.get('theme')
      applyTheme()
    }
    if (H.get('route')) S.route = H.get('route')
    if (H.get('ob')) {
      S.route = 'onboarding'
      S.ob.stage = H.get('ob')
      S.ob.expires = Date.now() + 899000
    }
    if (H.get('open'))
      H.get('open')
        .split(',')
        .forEach((n) => {
          const e = S.entries.find((x) => x.name === n)
          e && S.open.add(e.id)
        })
    if (H.get('pick')) {
      S.decisions['claude-code:code-review'] = 'keep_local'
      S.selected.add('a:codex:zentao-bug-export')
    }
    render()
    if (H.get('sec'))
      requestAnimationFrame(() => {
        const t = $('#sec-' + H.get('sec'))
        t && t.scrollIntoView()
      })
  })()
</script>
