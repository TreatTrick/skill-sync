<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Skill Sync - keep your AI agent Skills in sync across machines through your own GitHub Vault. Local-first, no SaaS, no telemetry."
    />
    <script>
      // Apply theme before paint to avoid FOUC.
      ;(function () {
        try {
          var stored = localStorage.getItem('skill-sync-site-theme')
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
