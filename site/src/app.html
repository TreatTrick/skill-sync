<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Open-source desktop app to sync Claude Code, Codex, and AI agent skills across computers through a private GitHub repository. Local-first, no SaaS, no telemetry."
    />
    <link rel="canonical" href="https://treattrick.github.io/skill-sync/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skill Sync" />
    <meta
      property="og:title"
      content="Skill Sync - Sync Claude Code & Codex Skills Across Machines"
    />
    <meta
      property="og:description"
      content="Open-source desktop app to sync Claude Code, Codex, and AI agent skills across computers through a private GitHub repository."
    />
    <meta
      property="og:url"
      content="https://treattrick.github.io/skill-sync/"
    />
    <meta
      property="og:image"
      content="https://treattrick.github.io/skill-sync/icon.png"
    />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Skill Sync - Sync Claude Code & Codex Skills Across Machines"
    />
    <meta
      name="twitter:description"
      content="Open-source desktop app to sync Claude Code, Codex, and AI agent skills across computers through a private GitHub repository."
    />
    <meta
      name="twitter:image"
      content="https://treattrick.github.io/skill-sync/icon.png"
    />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Skill Sync",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows, macOS",
        "description": "Open-source desktop app to sync Claude Code, Codex, and AI agent skills across computers through a private GitHub repository.",
        "url": "https://treattrick.github.io/skill-sync/",
        "downloadUrl": "https://github.com/TreatTrick/skill-sync/releases/latest",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "TreatTrick",
          "url": "https://github.com/TreatTrick"
        },
        "license": "https://github.com/TreatTrick/skill-sync/blob/main/LICENSE"
      }
    </script>

    <script>
      // Apply theme before paint to avoid FOUC.
      ;(function () {
        try {
          var stored = localStorage.getItem('skill-sync-site-theme')
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
